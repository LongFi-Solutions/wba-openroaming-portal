[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 25
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 10
pm.max_requests = 500

; Hardening from the PHP 2026-10-21 security advisory (CVE-2026-109618/109619).
; Set as admin values so applications cannot override them. nginx already caps
; request bodies at its 1M default, so 8M does not restrict uploads further.
php_admin_flag[session.upload_progress.enabled] = off
php_admin_value[post_max_size] = 8M

title: 'Two-Factor Authentication'
prompt: 'Please select an option to configure your experience.'
alreadyConfigured: 'You already have two-factor authentication configured for this account.'
mandatory: 'Two-factor authentication is mandatory for account security on the portal. You cannot proceed without enabling it. Please activate it immediately to continue.'
defaultAdminEmailNotAvailable: "Email verification is not available for the default administrator account — this address is not a real mailbox. Use a TOTP authenticator app instead. If TOTP has not been configured or access has been lost, run `%command%` on the portal web container of the machine to reset the super admin account. After that make sure to clear your browser cache and reauthenticate."

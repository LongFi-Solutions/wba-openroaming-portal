name: Docker

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # BUILD & TEST
  # Builds the portal Docker image, validates it starts cleanly, then pushes to
  # ghcr.io. On pull requests the push is skipped — CI still runs fully so you
  # know the PR is safe before merging.
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build portal image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: portal:ci-test
          cache-from: type=gha,scope=portal
          cache-to: type=gha,mode=max,scope=portal

      - name: Test portal container starts cleanly
        run: |
          docker run -d --name portal-test portal:ci-test

          sleep 5

          if [ "$(docker inspect -f '{{.State.Running}}' portal-test)" != "true" ]; then
            echo "portal container crashed on startup — logs:"
            docker logs portal-test
            docker rm portal-test
            exit 1
          fi

          echo "portal container is running"
          docker stop portal-test
          docker rm portal-test

      - name: Push portal image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}:${{ github.ref_name }}
          cache-from: type=gha,scope=portal


name: Docker

on:
  push:
    branches: ["production", "develop"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["production", "develop"]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # BUILD & TEST
  # Builds the portal Docker image, validates it starts cleanly, then pushes to
  # ghcr.io. On pull requests the push is skipped — CI still runs fully so you
  # know the PR is safe before merging.
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build portal image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: portal:ci-test
          cache-from: type=gha,scope=portal
          cache-to: type=gha,mode=max,scope=portal

      - name: Test portal container starts cleanly
        run: |
          docker run -d --name portal-test portal:ci-test

          sleep 5

          if [ "$(docker inspect -f '{{.State.Running}}' portal-test)" != "true" ]; then
            echo "portal container crashed on startup — logs:"
            docker logs portal-test
            docker rm portal-test
            exit 1
          fi

          echo "portal container is running"
          docker stop portal-test
          docker rm portal-test

      - name: Push portal image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}:${{ github.ref_name }}
          cache-from: type=gha,scope=portal

  # ─────────────────────────────────────────────────────────────────────────────
  # DEPLOY
  # Authenticates to GCP via Workload Identity Federation, then SSHes into the
  # VM through the IAP tunnel (no open port 22 needed). Pulls the tested image
  # from ghcr.io, restarts the stack, and runs any pending DB migrations.
  # Only runs on push to production — not on PRs, tag pushes, or develop.
  #
  # Required secrets:
  #   GCP_WORKLOAD_IDENTITY_PROVIDER — WIF provider resource name
  #   GCP_SERVICE_ACCOUNT            — service account email
  #   GCP_PROJECT_ID                 — GCP project ID
  #   GCP_ZONE                       — VM zone (e.g. us-central1-a)
  #   DEPLOY_HOST                    — VM instance name (not IP)
  #   DEPLOY_USER                    — Linux user on the VM
  #
  # Required IAM roles on the service account:
  #   roles/iap.tunnelResourceAccessor
  #   roles/compute.osLogin
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to portal VM via IAP
        env:
          REPO_LC: ${{ env.REPO_LC }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          gcloud compute ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            --tunnel-through-iap \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --command="
              set -e
              cd /home/$DEPLOY_USER/wba-openroaming-portal
              git config --global --add safe.directory /home/$DEPLOY_USER/wba-openroaming-portal
              git reset --hard HEAD
              git clean -fd
              git pull
              PORTAL_IMAGE=ghcr.io/$REPO_LC:production \
              docker compose -f docker-compose-ssl.yml pull
              PORTAL_IMAGE=ghcr.io/$REPO_LC:production \
              docker compose -f docker-compose-ssl.yml up -d
              docker compose -f docker-compose-ssl.yml exec -T web php bin/console doctrine:migrations:migrate --no-interaction
              docker image prune -f
            "